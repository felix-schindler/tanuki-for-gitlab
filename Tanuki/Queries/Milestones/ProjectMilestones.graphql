query ProjectMilestones($first: Int!, $after: String, $fullPath: ID!, $state: MilestoneStateEnum, $searchTitle: String, $includeAncestors: Boolean) {
  project(fullPath: $fullPath) {
    milestones(
      first: $first
      after: $after
      state: $state
      searchTitle: $searchTitle
      includeAncestors: $includeAncestors
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        iid
        state
        title
        description
        expired
        startDate
        dueDate
        stats {
          closedIssuesCount
          totalIssuesCount
        }
        webPath
      }
    }
  }
}
