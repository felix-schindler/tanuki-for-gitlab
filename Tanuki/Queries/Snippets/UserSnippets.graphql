query UserSnippets($first: Int!, $after: String, $username: String!) {
  user(username:$username) {
    snippets(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        title
        visibilityLevel
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
