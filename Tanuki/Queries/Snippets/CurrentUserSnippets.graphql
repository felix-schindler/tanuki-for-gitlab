query CurrentUserSnippets($first: Int!, $after: String) {
  currentUser {
    snippets(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        title
        visibilityLevel
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
