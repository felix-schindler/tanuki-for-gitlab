query ProjectSnippets($first: Int!, $after: String, $fullPath: ID!) {
  project(fullPath: $fullPath) {
    snippets(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        title
        visibilityLevel
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
