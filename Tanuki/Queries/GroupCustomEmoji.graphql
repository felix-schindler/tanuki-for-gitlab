query GroupCustomEmoji($first: Int!, $after: String, $fullPath: ID!) {
  group(fullPath: $fullPath) {
    customEmoji(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        url
        name
        createdAt
      }
    }
  }
}
