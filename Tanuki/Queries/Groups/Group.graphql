query Group($fullPath: ID!) {
  group(fullPath:$fullPath) {
    id

    avatarUrl
    name
    path
    visibility
    description

    descendantGroupsCount
    groupMembersCount
    projectsCount

    requestAccessEnabled
    webUrl

    maxAccessLevel {
      stringValue
    }

    userPermissions {
      createProjects
    }

    parent {
      name
      fullPath
    }
  }
}
