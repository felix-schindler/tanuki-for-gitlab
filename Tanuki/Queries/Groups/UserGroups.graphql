query UserGroups($first: Int!, $after: String, $username: String!) {
  user(username: $username) {
    groups(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        avatarUrl
        name
        fullPath
        visibility
        groupMembersCount
        projectsCount
        maxAccessLevel {
          stringValue
        }
      }
    }
  }
}
