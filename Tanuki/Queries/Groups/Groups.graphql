query Groups($first: Int!, $after: String, $topLevelOnly: Boolean, $ownedOnly: Boolean, $search: String, $parentPath: ID, $allAvailable: Boolean, $markedForDeletionOn: Date, $active: Boolean) {
  groups(
    first: $first
    after: $after
    topLevelOnly: $topLevelOnly
    ownedOnly: $ownedOnly
    search: $search
    parentPath: $parentPath
    allAvailable: $allAvailable
    markedForDeletionOn: $markedForDeletionOn
    active: $active
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      avatarUrl
      name
      fullPath
      visibility
      maxAccessLevel {
        stringValue
      }
    }
  }
}
