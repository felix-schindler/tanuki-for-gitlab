query CurrentUserTodos($first: Int!, $after: String) {
  currentUser {
    todos(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        body
        group {
          fullPath
        }
        state
        action
        author {
          avatarUrl
          name
          username
        }
        targetEntity {
          webUrl
        }
        project {
          avatarUrl
          fullPath
          nameWithNamespace
          visibility
          archived
        }
        createdAt
        targetType
      }
    }
  }
}
