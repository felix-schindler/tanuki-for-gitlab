query GroupProjects($first: Int!, $after: String, $fullPath: ID!) {
  group(fullPath: $fullPath) {
    projects(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        avatarUrl
        nameWithNamespace
        visibility
        fullPath
        archived
      }
    }
  }
}
