query Projects($first: Int!, $after: String, $membership: Boolean, $search: String, $personal: Boolean, $sort: String, $withIssuesEnabled: Boolean, $withMergeRequestsEnabled: Boolean, $archived: ProjectArchived, $minAccessLevel: AccessLevelEnum, $aimedForDeletion: Boolean, $notAimedForDeletion: Boolean, $markedForDeletionOn: Date, $active: Boolean) {
  projects(
    first: $first
    after: $after
    membership: $membership
    search: $search
    personal: $personal
    sort: $sort
    withIssuesEnabled: $withIssuesEnabled
    withMergeRequestsEnabled: $withMergeRequestsEnabled
    archived: $archived
    minAccessLevel: $minAccessLevel
    aimedForDeletion: $aimedForDeletion
    notAimedForDeletion: $notAimedForDeletion
    markedForDeletionOn: $markedForDeletionOn
    active: $active
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      avatarUrl
      nameWithNamespace
      visibility
      fullPath
      archived
    }
  }
}
