query UserMembershipProjects($first: Int!, $after: String, $username: String!) {
  user(username: $username) {
    projectMemberships(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        project {
          avatarUrl
          nameWithNamespace
          visibility
          fullPath
          archived
        }
      }
    }
  }
}
