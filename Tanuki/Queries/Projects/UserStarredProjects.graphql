query UserStarredProjects($first: Int!, $after: String, $username: String!) {
  user(username:$username) {
    starredProjects(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        avatarUrl
        nameWithNamespace
        visibility
        fullPath
        archived
      }
    }
  }
}
