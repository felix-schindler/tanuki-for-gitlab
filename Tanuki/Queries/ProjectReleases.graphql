query ProjectReleasesQuery($first: Int!, $after: String, $fullPath: ID!) {
  project(fullPath: $fullPath) {
    releases(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        name
        description
        tagName
        releasedAt

        author {
          avatarUrl
          name
          username
        }

        commit {
          shortId
        }

        milestones {
          nodes {
            id
            title
          }
        }

        assets {
          count
          links {
            nodes {
              id
              name
              url
              directAssetUrl
              directAssetPath
            }
          }
          sources {
            nodes {
              url
              format
            }
          }
        }
      }
    }
  }
}
