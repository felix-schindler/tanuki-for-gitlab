query GroupTimelogs($first: Int!, $after: String, $fullPath: ID!) {
  group(fullPath: $fullPath) {
    timelogs(sort: SPENT_AT_DESC, first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        user {
          avatarUrl
          name
          username
        }
        spentAt
        summary
        timeSpent
        project {
          fullPath
          nameWithNamespace
        }
        issue {
          iid
        }
        mergeRequest {
          iid
        }
      }
    }
  }
}
