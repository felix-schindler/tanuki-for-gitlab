query ProjectIssues(
  $first: Int!
  $after: String
  $fullPath: ID!
  $state: IssuableState
  $search: String
  $confidential: Boolean
  $subscribed: SubscriptionStatus
  $types: [IssueType!]
  $labels: [String]
  $milestones: [String]
  $authorUsername: String
  $assigneeUsernames: [String!]
  $createdAfter: Time
  $createdBefore: Time
  $updatedAfter: Time
  $updatedBefore: Time
) {
  project(fullPath: $fullPath) {
    id
    issuesEnabled
    userPermissions {
      createIssue
    }
    issues(
      first: $first
      after: $after
      state: $state
      search: $search
      confidential: $confidential
      subscribed: $subscribed
      types: $types
      labelName: $labels
      milestoneTitle: $milestones
      authorUsername: $authorUsername
      assigneeUsernames: $assigneeUsernames
      createdAfter: $createdAfter
      createdBefore: $createdBefore
      updatedAfter: $updatedAfter
      updatedBefore: $updatedBefore
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        iid
        title
        reference(full: true)
        state
        upvotes
        downvotes
        userNotesCount
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
