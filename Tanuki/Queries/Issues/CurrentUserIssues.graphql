query CurrentUserIssues(
  $state: IssuableState
  $search: String
  $confidential: Boolean
  $subscribed: SubscriptionStatus
  $types: [IssueType!]
  $labels: [String]
  $milestones: [String]
  $authorUsername: String
  $assigneeUsernames: [String!]
  $createdAfter: Time
  $createdBefore: Time
  $updatedAfter: Time
  $updatedBefore: Time
) {
  currentUser {
    projectMemberships {
      nodes {
        project {
          fullPath
          issues(
            state: $state
            search: $search
            confidential: $confidential
            subscribed: $subscribed
            types: $types
            labelName: $labels
            milestoneTitle: $milestones
            authorUsername: $authorUsername
            assigneeUsernames: $assigneeUsernames
            createdAfter: $createdAfter
            createdBefore: $createdBefore
            updatedAfter: $updatedAfter
            updatedBefore: $updatedBefore
          ) {
            nodes {
              iid
              title
              reference(full: true)
              state
              upvotes
              downvotes
              userNotesCount
              author {
                avatarUrl
                name
                username
              }
              createdAt
              webUrl
            }
          }
        }
      }
    }
  }
}
