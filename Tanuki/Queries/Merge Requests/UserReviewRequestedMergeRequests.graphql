query UserReviewRequestedMergeRequests(
  $state: MergeRequestState
  $search: String
  $draft: Boolean
  $subscribed: SubscriptionStatus
  $labels: [String]
  $milestone: String
  $createdAfter: Time
  $createdBefore: Time
  $updatedAfter: Time
  $updatedBefore: Time
) {
  currentUser {
    reviewRequestedMergeRequests(
      state: $state
      search: $search
      draft: $draft
      subscribed: $subscribed
      labelName: $labels
      milestoneTitle: $milestone
      createdAfter: $createdAfter
      createdBefore: $createdBefore
      updatedAfter: $updatedAfter
      updatedBefore: $updatedBefore
    ) {
      count
      nodes {
        project {
          fullPath
        }
        iid
        title
        reference(full: true)
        state
        upvotes
        downvotes
        userNotesCount
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
