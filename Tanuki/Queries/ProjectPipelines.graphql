query ProjectPipelines($fullPath: ID!) {
  project(fullPath: $fullPath) {
    pipelines {
      nodes {
        id
        iid
        name
        user {
          avatarUrl
          name
          username
        }
        ref
        commit {
          shortId
        }
        source
        status
        cancelable
        createdAt
      }
    }
  }
}
