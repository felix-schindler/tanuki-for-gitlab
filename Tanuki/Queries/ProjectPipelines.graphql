query ProjectPipelines($first: Int!, $after: String, $fullPath: ID!) {
  project(fullPath: $fullPath) {
    pipelines(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        iid
        name
        user {
          avatarUrl
          name
          username
        }
        ref
        commit {
          shortId
        }
        source
        status
        createdAt
      }
    }
  }
}
