query MergeRequestCommits($first: Int!, $after: String, $fullPath: ID!, $iid: String!) {
  project(fullPath: $fullPath) {
    id
    mergeRequest(iid: $iid) {
      commits(first: $first, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          title
          shortId
          authorName
          author {
            avatarUrl
            name
            username
          }
          authoredDate
          webUrl
          signature {
            verificationStatus
          }
          pipelines {
            nodes {
              status
            }
          }
        }
      }
    }
  }
}
