query ProjectMembers($first: Int!, $after: String, $fullPath: ID!) {
  project(fullPath:$fullPath) {
    projectMembers(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        createdBy {
          avatarUrl
          name
          username
        }
        createdAt
        expiresAt
        accessLevel {
          stringValue
        }
        user {
          avatarUrl
          name
          username
        }
      }
    }
  }
}
